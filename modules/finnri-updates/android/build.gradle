plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.finnri'
version = '1.0.0'

android {
  namespace "expo.modules.finnriupdates"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Google Play's in-app updates. Works only for installs from Play.
  implementation 'com.google.android.play:app-update:2.1.0'
}
